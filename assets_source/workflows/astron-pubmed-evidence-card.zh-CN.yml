                  nodeId: node-start::b7ecb0f8-5d47-4c82-a35c-61d2d5f77951
                contentErrMsg: ''
        outputs:
          - id: 440258ec-d9c1-476e-830d-f4cb6443f78d
            name: result
            nameErrMsg: ''
            schema:
              type: string
              default: ''
        nodeParam:
          uid: '0'
          code: |-
            import json
            import os
            import urllib.error
            import urllib.request

            def main(input):
                question = (input or "").strip()
                if not question:
                    raise RuntimeError("Please enter a medical literature question")
                bridge_base_url = os.getenv("PUBMED_BRIDGE_BASE_URL", "http://host.docker.internal:8791").rstrip("/")
                token = os.getenv("PUBMED_BRIDGE_TOKEN", "").strip()
                if not token:
                    raise RuntimeError("Set PUBMED_BRIDGE_TOKEN in the workflow runtime environment")
                body = json.dumps(
                    {"question": question, "max_results": 3},
                    ensure_ascii=False,
                ).encode("utf-8")
                request = urllib.request.Request(
                    bridge_base_url + "/v1/pubmed-search",
                    data=body,
                    headers={
                        "Content-Type": "application/json; charset=utf-8",
                        "Accept": "application/json",
                        "X-Bridge-Token": token,
                    },
                    method="POST",
                )
                try:
                    with urllib.request.urlopen(request, timeout=120) as response:
                        status = response.getcode()
                        text = response.read().decode("utf-8")
                except urllib.error.HTTPError as error:
                    detail = error.read().decode("utf-8", errors="replace")
                    raise RuntimeError(f"PubMed bridge HTTP {error.code}: {detail}")
                except urllib.error.URLError as error:
                    raise RuntimeError(f"PubMed bridge unavailable: {error.reason}")
                try:
                    result = json.loads(text)
                except json.JSONDecodeError:
                    raise RuntimeError(f"PubMed bridge returned non-JSON HTTP {status}")
                if not result.get("ok"):
                    raise RuntimeError("PubMed MCP search did not complete successfully")
                articles = result.get("articles") or []
                if not articles:
                    raise RuntimeError("PubMed MCP returned no articles; broaden the question")
                return {"result": json.dumps(result, ensure_ascii=False)}
          apiKey: YOUR_API_KEY
          appId: YOUR_APP_ID
          apiSecret: YOUR_API_SECRET
          codeErrMsg: ''
        retryConfig:
          maxRetries: 0
          shouldRetry: true
