                  nodeId: ifly-code::bd2d1962-a014-4e39-9a9a-5596ae79fc3f
                contentErrMsg: ''
        outputs:
          - id: 32bbdb74-9d41-490d-bc17-0abf8093c034
            name: result
            nameErrMsg: ''
            schema:
              type: string
              default: ''
        nodeParam:
          uid: '0'
          code: |-
            import json
            import os
            import urllib.error
            import urllib.request

            def main(input):
                search = json.loads(input)
                articles = search.get("articles") or []
                payload = {
                    "question": search.get("question", ""),
                    "query": search.get("query", ""),
                    "articles": articles,
                }
                token = os.getenv("PUBMED_BRIDGE_TOKEN", "").strip()
                if not token:
                    raise RuntimeError("Set PUBMED_BRIDGE_TOKEN in the workflow runtime environment")
                bridge_base_url = os.getenv("PUBMED_BRIDGE_BASE_URL", "http://host.docker.internal:8791").rstrip("/")
                request = urllib.request.Request(
                    bridge_base_url + "/v1/spark-evidence-card",
                    data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
                    headers={
                        "Content-Type": "application/json; charset=utf-8",
                        "Accept": "application/json",
                        "X-Bridge-Token": token,
                    },
                    method="POST",
                )
                try:
                    with urllib.request.urlopen(request, timeout=120) as response:
                        parsed = json.loads(response.read().decode("utf-8"))
                except urllib.error.HTTPError as error:
                    detail = error.read().decode("utf-8", errors="replace")
                    raise RuntimeError(f"Spark evidence bridge HTTP {error.code}: {detail}")
                except urllib.error.URLError as error:
                    raise RuntimeError(f"Spark evidence bridge unavailable: {error.reason}")
                if not parsed.get("ok"):
                    raise RuntimeError("Spark evidence-card step did not complete successfully")
                source_pmids = {str(item.get("pmid", "")) for item in articles}
                card = parsed.get("evidence_card") or {}
                card_pmids = {str(item.get("pmid", "")) for item in card.get("articles", [])}
                unknown = sorted(card_pmids - source_pmids)
                if unknown:
                    raise RuntimeError("Evidence card introduced unknown PMID: " + ", ".join(unknown))
                parsed["citation_audit"] = {
                    "passed": True,
                    "source_pmids": sorted(source_pmids),
                    "card_pmids": sorted(card_pmids),
                }
                return {"result": json.dumps(parsed, ensure_ascii=False)}
          apiKey: YOUR_API_KEY
          appId: YOUR_APP_ID
          apiSecret: YOUR_API_SECRET
          codeErrMsg: ''
        retryConfig:
          maxRetries: 0
          shouldRetry: true
          customOutput: {}
          errorStrategy: 0
          timeout: 120
        icon: https://oss-beijing-m8.openstorage.cn/pro-bucket/sparkBot/common/workflow/icon/codeIcon.png
        description: 将 PubMed MCP 原始结果交给 Spark Ultra 进行中文整理，并强制校验输出 PMID 必须来自检索结果。
