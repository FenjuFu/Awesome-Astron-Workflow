          - id: 080361ec-9491-4c16-8b7a-29a4e8f4fc19
            name: output
            nameErrMsg: ''
            schema:
              type: string
              default: ''
        nodeParam:
          uid: '0'
          code: |-
            import json

            def main(input):
                data = json.loads(input)
                markdown = (data.get("markdown") or "").strip()
                if not markdown:
                    card = data.get("evidence_card") or {}
                    lines = [
                        "# PubMed 中文证据卡",
                        "",
                        "**问题**：" + card.get("question", ""),
                        "",
                        "## 证据摘要",
                        "",
                        card.get("evidence_summary", ""),
                        "",
                        "## 来源论文",
                    ]
                    for article in card.get("articles", []):
                        lines.extend([
                            "",
                            "### PMID " + str(article.get("pmid", "")) + "：" + article.get("title_zh", ""),
                            "- 英文引用：" + article.get("citation", ""),
                            "- 核心发现：" + article.get("main_finding_zh", ""),
                            "- 局限：" + article.get("limitations_zh", ""),
                            "- 来源：" + article.get("pubmed_url", ""),
                        ])
                    lines.extend(["", "## 安全提示", "", card.get("safety_note", "")])
                    markdown = "\n".join(lines)
                audit = data.get("citation_audit") or {}
                if not audit.get("passed"):
                    raise RuntimeError("Citation audit was not passed")
                return {"output": markdown}
          apiKey: YOUR_API_KEY
          appId: YOUR_APP_ID
          apiSecret: YOUR_API_SECRET
          codeErrMsg: ''
        icon: https://oss-beijing-m8.openstorage.cn/pro-bucket/sparkBot/common/workflow/icon/codeIcon.png
        description: 把结构化证据卡渲染为带 PubMed 链接、局限和医疗安全提示的 Markdown。
        updatable: false
