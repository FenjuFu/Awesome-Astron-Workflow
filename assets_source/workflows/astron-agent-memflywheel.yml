      nodeParam:
        uid: '0'
        code: |-
          import json
          import os
          import urllib.error
          import urllib.request

          def main(input):
              required_env = (
                  "SPARK_APPID",
                  "SPARK_APIKEY",
                  "SPARK_API_SECRET",
              )
              missing_env = [name for name in required_env if not os.getenv(name)]
              if missing_env:
                  raise RuntimeError(
                      "Astron workflow credential environment is incomplete: "
                      + ", ".join(missing_env)
                  )

              endpoint = "http://host.docker.internal:8787/v1/demo"
              payload = json.dumps(
                  {"query": input},
                  ensure_ascii=False,
              ).encode("utf-8")
              request = urllib.request.Request(
                  endpoint,
                  data=payload,
                  headers={
                      "Content-Type": "application/json; charset=utf-8",
                      "Accept": "application/json",
                  },
                  method="POST",
              )

              try:
                  with urllib.request.urlopen(request, timeout=8) as response:
                      status = response.getcode()
                      body = response.read().decode("utf-8")
              except urllib.error.HTTPError as error:
                  detail = error.read().decode("utf-8", errors="replace")
                  raise RuntimeError(
                      f"MemFlywheel bridge HTTP {error.code}: {detail}"
                  )
              except urllib.error.URLError as error:
                  raise RuntimeError(
                      f"MemFlywheel bridge unavailable: {error.reason}"
                  )

              try:
                  parsed = json.loads(body)
              except json.JSONDecodeError:
                  parsed = {
                      "ok": 200 <= status < 300,
                      "raw": body,
                  }

              parsed["astronEnvironment"] = {
                  "sparkCredentialsConfigured": True,
                  "valuesExposed": False,
              }

              return {
                  "result": json.dumps(
                      parsed,
                      ensure_ascii=False,
                      indent=2,
                  )
              }
        apiKey: YOUR_API_KEY
        appId: YOUR_APP_ID
        apiSecret: YOUR_API_SECRET
        codeErrMsg: ''
