          - id: 080361ec-9491-4c16-8b7a-29a4e8f4fc19
            name: output
            nameErrMsg: ''
            schema:
              type: string
              default: ''
        nodeParam:
          uid: '0'
          code: |-
            import json

            def main(input):
                data = json.loads(input)
                markdown = (data.get("markdown") or "").strip()
                if not markdown:
                    card = data.get("evidence_card") or {}
                    lines = [
                        "# PubMed Evidence Card",
                        "",
                        "**Question:** " + card.get("question", ""),
                        "",
                        "## Evidence summary",
                        "",
                        card.get("evidence_summary", ""),
                        "",
                        "## Source articles",
                    ]
                    for article in card.get("articles", []):
                        title = article.get("title") or article.get("title_en") or article.get("title_zh", "")
                        finding = article.get("main_finding") or article.get("main_finding_en") or article.get("main_finding_zh", "")
                        limitations = article.get("limitations") or article.get("limitations_en") or article.get("limitations_zh", "")
                        lines.extend([
                            "",
                            "### PMID " + str(article.get("pmid", "")) + ": " + title,
                            "- Citation: " + article.get("citation", ""),
                            "- Main finding: " + finding,
                            "- Limitations: " + limitations,
                            "- Source: " + article.get("pubmed_url", ""),
                        ])
                    lines.extend(["", "## Safety note", "", card.get("safety_note", "")])
                    markdown = "\n".join(lines)
                audit = data.get("citation_audit") or {}
                if not audit.get("passed"):
                    raise RuntimeError("Citation audit was not passed")
                return {"output": markdown}
          apiKey: YOUR_API_KEY
          appId: YOUR_APP_ID
          apiSecret: YOUR_API_SECRET
          codeErrMsg: ''
        icon: https://oss-beijing-m8.openstorage.cn/pro-bucket/sparkBot/common/workflow/icon/codeIcon.png
        description: Renders the audited evidence card as English Markdown with PubMed links, limitations, and a medical safety note.
        updatable: false
