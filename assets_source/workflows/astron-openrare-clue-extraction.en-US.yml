        outputs:
          - id: 669979cb-99d5-4833-a9b8-f0f0a93329f9
            name: output
            nameErrMsg: ''
            schema:
              type: string
              default: ''
        nodeParam:
          uid: '0'
          code: |-
            import json

            def main(input):
                data = json.loads(input)
                phenotypes = data.get("phenotypes") or []
                lines = [
                    "# OpenRare Phenotype Clue Extraction Result",
                    "",
                    "- Run ID: `" + str(data.get("run_id", "")) + "`",
                    "- Execution mode: `" + str(data.get("mode", "")) + "`",
                    "- Input digest: only the SHA-256 digest and character count are retained; the clinical note is not echoed",
                    "- Source commit: `" + str((data.get("source") or {}).get("commit", "")) + "`",
                    "",
                    "## Extracted abnormal phenotypes and candidate HPO terms",
                    "",
                ]
                if not phenotypes:
                    lines.append("No mappable abnormal phenotype was extracted in this run.")
                for index, item in enumerate(phenotypes, 1):
                    lines.extend([
                        str(index) + ". **" + str(item.get("phrase", "")) + "**",
                        "   - Category: " + str(item.get("category", "")),
                        "   - HPO: `" + str(item.get("hpo_id", "")) + "` " + str(item.get("hpo_term", "")),
                        "   - Match method: " + str(item.get("match_method", "")),
                    ])
                warnings = data.get("warnings") or []
                lines.extend(["", "## Execution boundaries", ""])
                for warning in warnings:
                    lines.append("- " + str(warning))
                lines.extend([
                    "- This run uses `openrare-compat-dictionary` mode. It does not claim to run the full OpenRare FAISS RAG, VCF annotation, variant-ranking, or reporting pipeline.",
                    "- The output is a phenotype clue for professional review, not a diagnosis, treatment recommendation, or patient-triage decision.",
                ])
                return {"output": "\n".join(lines)}
          apiKey: YOUR_API_KEY
          appId: YOUR_APP_ID
          apiSecret: YOUR_API_SECRET
          codeErrMsg: ''
        icon: https://oss-beijing-m8.openstorage.cn/pro-bucket/sparkBot/common/workflow/icon/codeIcon.png
        description: Turns the real execution result into recordable English Markdown while preserving the run ID, execution mode, source commit, HPO terms, and mapping methods.
        updatable: false
