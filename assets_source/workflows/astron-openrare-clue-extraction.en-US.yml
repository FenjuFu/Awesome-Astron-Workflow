        outputs:
          - id: 7637da52-627c-4761-aed3-d30f419c1ff4
            name: result
            nameErrMsg: ''
            schema:
              type: string
              default: ''
        nodeParam:
          uid: '0'
          code: |-
            import json
            import os
            import urllib.error
            import urllib.request

            def main(input):
                clinical_note = (input or "").strip()
                if not clinical_note:
                    raise RuntimeError("Please enter a de-identified or synthetic clinical note")
                if len(clinical_note) > 5000:
                    raise RuntimeError("Clinical note is longer than the 5000-character demo limit")
                payload = {
                    "patient_id": "ASTRON-DEMO-001",
                    "clinical_note": clinical_note,
                }
                bridge_base_url = os.getenv(
                    "OPENRARE_BRIDGE_BASE_URL",
                    "http://host.docker.internal:18083",
                ).rstrip("/")
                request = urllib.request.Request(
                    bridge_base_url + "/api/v1/extract",
                    data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
                    headers={
                        "Content-Type": "application/json; charset=utf-8",
                        "Accept": "application/json",
                    },
                    method="POST",
                )
                try:
                    with urllib.request.urlopen(request, timeout=120) as response:
                        result = json.loads(response.read().decode("utf-8"))
                except urllib.error.HTTPError as error:
                    detail = error.read().decode("utf-8", errors="replace")
                    raise RuntimeError(f"OpenRare bridge HTTP {error.code}: {detail}")
                except urllib.error.URLError as error:
                    raise RuntimeError(f"OpenRare bridge unavailable: {error.reason}")
                if result.get("status") not in ("completed", "success"):
                    raise RuntimeError("OpenRare compatibility extraction did not complete")
                if result.get("mode") != "openrare-compat-dictionary":
                    raise RuntimeError("Unexpected OpenRare execution mode")
                result["workflow_boundary"] = {
                    "purpose": "phenotype-clue extraction only",
                    "diagnosis": False,
                    "requires_professional_review": True,
                }
                return {"result": json.dumps(result, ensure_ascii=False)}
          apiKey: YOUR_API_KEY
          appId: YOUR_APP_ID
          apiSecret: YOUR_API_SECRET
          codeErrMsg: ''
        retryConfig:
          maxRetries: 0
          shouldRetry: true
          customOutput: {}
          errorStrategy: 0
          timeout: 120
        icon: https://oss-beijing-m8.openstorage.cn/pro-bucket/sparkBot/common/workflow/icon/codeIcon.png
        description: 'Calls the real bridge: Spark Ultra extracts abnormal phenotypes using the OpenRare system_message_I prompt, then the repository CHPO dictionary constrains candidate mapping. The compatibility mode remains explicit.'
