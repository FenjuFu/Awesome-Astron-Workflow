            description: Turn supplied photo or folder manifests into sparse vertical
              paper-poster prompts with large negative space, one small source-faithful
              visual event, restrained print texture, and one colour accent. Use when
              a poetic minimal-zine treatment is preferred over a generous editorial
              photo window.
          - skillId: '2'
            name: paper-signal-art-director
            description: Inspect supplied photo or folder manifests and produce high-preservation
              Paper Signal art direction, exact four-paragraph image prompts, and
              QA criteria for landscapes, architecture, portraits, and objects. Use
              for faithful photo-to-zine editorial treatment where the subject must
              remain recognisable.
