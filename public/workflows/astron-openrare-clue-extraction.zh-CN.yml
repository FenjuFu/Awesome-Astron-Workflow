          - id: 669979cb-99d5-4833-a9b8-f0f0a93329f9
            name: output
            nameErrMsg: ''
            schema:
              type: string
              default: ''
        nodeParam:
          uid: '0'
          code: |-
            import json

            def main(input):
                data = json.loads(input)
                phenotypes = data.get("phenotypes") or []
                lines = [
                    "# OpenRare 表型线索提取结果",
                    "",
                    "- 运行编号：`" + str(data.get("run_id", "")) + "`",
                    "- 执行模式：`" + str(data.get("mode", "")) + "`",
                    "- 输入摘要：仅保存 SHA-256 与字符数，不回显临床原文",
                    "- 源码提交：`" + str((data.get("source") or {}).get("commit", "")) + "`",
                    "",
                    "## 提取到的异常表型与候选 HPO",
                    "",
                ]
                if not phenotypes:
                    lines.append("本次未提取到可映射的异常表型。")
                for index, item in enumerate(phenotypes, 1):
                    lines.extend([
                        str(index) + ". **" + str(item.get("phrase", "")) + "**",
                        "   - 分类：" + str(item.get("category", "")),
                        "   - HPO：`" + str(item.get("hpo_id", "")) + "` " + str(item.get("hpo_term", "")),
                        "   - 匹配方法：" + str(item.get("match_method", "")),
                    ])
                warnings = data.get("warnings") or []
                lines.extend(["", "## 运行边界", ""])
                for warning in warnings:
                    lines.append("- " + str(warning))
                lines.extend([
                    "- 当前为 `openrare-compat-dictionary` 兼容模式，不冒充 OpenRare 完整 FAISS RAG、VCF 注释、变异排序或报告管线。",
                    "- 结果仅是供专业人员复核的表型线索，不构成诊断、治疗建议或患者分诊依据。",
                ])
                return {"output": "\n".join(lines)}
          apiKey: YOUR_API_KEY
          appId: YOUR_APP_ID
          apiSecret: YOUR_API_SECRET
          codeErrMsg: ''
