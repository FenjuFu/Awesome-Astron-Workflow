<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Focus Timer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: #f6efe3;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }
  .card {
    width: 350px;
    max-width: 470px;
    min-height: 200px;
    background: #c9b8e0;
    border-radius: 24px;
    padding: 32px 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
    color: #2d1f3d;
  }
  .display {
    font-size: 44px;
    font-weight: 700;
    letter-spacing: 2px;
  }
  .controls {
    display: flex;
    gap: 12px;
    width: 100%;
  }
  button {
    flex: 1;
    padding: 14px 0;
    font-size: 16px;
    font-weight: 600;
    border: none;
    border-radius: 14px;
    background: #2d1f3d;
    color: #f6efe3;
    cursor: pointer;
    transition: transform 0.1s ease, background 0.2s ease;
  }
  button:active { transform: scale(0.97); }
  .status {
    font-size: 14px;
    font-weight: 500;
    color: #4a3d5c;
    text-align: center;
  }
  input {
    width: 100%;
    padding: 10px;
    font-size: 16px;
    border: 2px solid #2d1f3d;
    border-radius: 10px;
    background: #f6efe3;
    color: #2d1f3d;
    text-align: center;
    margin-top: 2px;
  }
  input:disabled {
    background: #d8cbe6;
    color: #7a6c8f;
  }
  input::-webkit-inner-spin-button,
  input::-webkit-outer-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  .progress {
    width: 100%;
    height: 14px;
    background: #e3d6ec;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 4px;
  }
  #progress {
    height: 14px;
    width: 100%;
    background: #2d1f3d;
    border-radius: 10px;
  }
</style>
</head>
<body>
<div class="card">
  <input id="duration" type="number" min="1" max="3600" value="60" aria-label="Time duration in seconds">
  <div class="display" id="display">01:00</div>
  <div class="progress"><div id="progress" max="60" value="60"></div></div>
  <div class="controls">
    <button id="startBtn" aria-label="Start">Start</button>
    <button id="pauseBtn" aria-label="Pause">Pause</button>
    <button id="resetBtn" aria-label="Reset">Reset</button>
  </div>
  <div class="status" id="status">Ready</div>
</div>
<script>
const input=document.getElementById('duration'),display=document.getElementById('display'),bar=document.getElementById('progress'),statusText=document.getElementById('status');
let remaining=60,total=60,interval=null;
function update(){display.textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');bar.max=total;bar.value=remaining;input.disabled=interval!==null;}
function pause(){if(interval!==null)clearInterval(interval);interval=null;statusText.textContent='Paused';update();}
function reset(){pause();const n=Number(input.value);total=Number.isInteger(n)&&n>=1&&n<=3600?n:60;input.value=total;remaining=total;statusText.textContent='Ready';update();}
function start(){if(interval!==null)return;if(remaining<=0)reset();statusText.textContent='Focusing';interval=setInterval(()=>{remaining--;if(remaining<=0){remaining=0;clearInterval(interval);interval=null;statusText.textContent='Done';}update();},1000);update();}
input.addEventListener('change',()=>{if(interval===null)reset();});
const startBtn=document.getElementById('startBtn'),pauseBtn=document.getElementById('pauseBtn'),resetBtn=document.getElementById('resetBtn');
startBtn.addEventListener('click',start);
pauseBtn.addEventListener('click',pause);
resetBtn.addEventListener('click',reset);
reset();
</script>
</body>
</html>
