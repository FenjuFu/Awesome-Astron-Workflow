name: Galaxy daily refresh

on:
  schedule:
    # 09:30 Asia/Shanghai. GitHub scheduled starts can be delayed.
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: galaxy-daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ secrets.GALAXY_GH_TOKEN }}
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out the immutable workflow commit
        # The repository contains legacy gitlinks without .gitmodules entries.
        # Native checkout avoids checkout-action's recursive submodule auth cleanup.
        run: |
          test -n "$GH_TOKEN"
          test "$(gh api user --jq .login)" = FenjuFu
          gh auth setup-git
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout -b master FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify authenticated owner
        run: |
          mkdir -p .cache/galaxy-receipts
          printf '{"runId":"%s","sourceSha":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > .cache/galaxy-receipts/run.json
          test -n "$GH_TOKEN"
          test "$(gh api user --jq .login)" = FenjuFu
          gh auth setup-git
      - name: Collect fresh history and calculate scores
        run: python scripts/update-galaxy.py
      - name: Validate calculations and production build
        run: |
          python scripts/test_local_openrank.py
          python scripts/test_galaxy_publish.py
          python scripts/verify-galaxy-calculation.py
          npm ci
          npm run build
      - name: Publish data PR, request reviewers and merge after checks
        run: python scripts/publish-galaxy-refresh.py
      - name: Verify production data
        run: python scripts/verify-galaxy-production.py --timeout 1200
      - name: Retain receipt on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: galaxy-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/galaxy-receipts/
          if-no-files-found: warn
          retention-days: 30
